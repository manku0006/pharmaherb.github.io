<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaHerb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Intro Page Styles */
        .intro {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: relative;
        }

        .typing-container {
            text-align: center;
            font-size: clamp(2rem, 8vw, 6rem);
            font-weight: 700;
            min-height: 200px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-text {
            border-right: none;
            overflow: hidden;
            white-space: nowrap;
        }

        .authors {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 1.2rem;
            opacity: 0;
            transition: all 0.8s ease;
            width: 90%;
        }

        .authors .names {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .authors .school {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Main Page Styles */
        .main-page {
            display: none;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .search-bar {
            max-width: 600px;
            margin: 0 auto 3rem;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1.2rem;
            border: 2px solid #e1e5e9;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.9);
        }

        .search-bar input:focus {
            border-color: #4facfe;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        }

        .tabs-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .tab {
            padding: 1.5rem;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            backdrop-filter: blur(10px);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .tab:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-color: #4facfe;
        }

        /* Herb Detail Page */
        .herb-detail {
            display: none;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            overflow-y: auto;
        }

        .herb-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .herb-image {
            width: 300px;
            height: 300px;
            border-radius: 20px;
            margin: 0 auto 2rem;
            display: block;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .detail-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            padding-bottom: 4rem;
        }

        .detail-card {
            background: rgba(255,255,255,0.95);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: 100%;
        }

        .detail-card h3 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            padding: 1rem 2rem;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            background: #4facfe;
            color: white;
            transform: translateY(-2px);
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

        function typeWriter() {
            if (charIndex < fullText.length) {
                typingElement.textContent = fullText.substring(0, charIndex + 1);
                charIndex++;
                setTimeout(typeWriter, 150);
            } else {
                document.getElementById('authorsText').style.opacity = '1';
                setTimeout(() => {
                    document.getElementById('introPage').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('introPage').style.display = 'none';
                        document.getElementById('mainPage').style.display = 'block';
                        populateHerbs();
                    }, 500);
                }, 2000);
            }
        }

        function populateHerbs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';
            
            const sortedHerbs = Object.keys(herbs).sort((a, b) => {
                return herbs[a].name.localeCompare(herbs[b].name);
            });
            
            sortedHerbs.forEach(herbKey => {
                const tab = document.createElement('div');
                tab.className = 'tab';
                tab.textContent = herbs[herbKey].name;
                tab.onclick = () => showHerbDetail(herbKey);
                container.appendChild(tab);
            });
            console.log(`✅ Loaded ${sortedHerbs.length} herbs!`);
        }

        function showHerbDetail(herbKey) {
            const herb = herbs[herbKey];
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('herbDetail').style.display = 'block';
            
            document.getElementById('herbImage').src = herb.image;
            document.getElementById('herbName').textContent = herb.name;
            
            const detailGrid = document.getElementById('detailGrid');
            detailGrid.innerHTML = '';
            
            Object.entries(herb.details).forEach(([title, description]) => {
                const card = document.createElement('div');
                card.className = 'detail-card';
                card.innerHTML = `<h3>${title}</h3><p>${description}</p>`;
                detailGrid.appendChild(card);
            });
        }

        function filterHerbs() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const tabs = document.querySelectorAll('.tab');
            
            tabs.forEach(tab => {
                const herbName = tab.textContent.toLowerCase();
                tab.style.display = herbName.includes(input) ? 'block' : 'none';
            });
        }

        function showMainPage() {
            document.getElementById('herbDetail').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
        }

        function showIntro() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('herbDetail').style.display = 'none';
            document.getElementById('introPage').style.display = 'flex';
            document.getElementById('introPage').style.opacity = '1';
            location.reload();
        }

        typeWriter();
    </script>
</body>
</html>
